<title>Duke's Diamond Strength</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow phone column; segmented tabs pinned on top, rest timer pinned on bottom, workout as a stack of exercise cards with a demo, set counters and history */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --ink: #14213A;
  --muted: #5A6577;
  --faint: #A9B3BF;
  --line: #D6DCD6;
  --clay: #B9502A;
  --clay-ink: #FFFFFF;
  --grass: #2E7A4C;
  --grass-soft: #E3F1E8;
  --clay-soft: #F7E7DF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1421; --surface: #162033; --ink: #E7ECF3; --muted: #97A2B4; --faint: #56637A; --line: #26324A;
    --clay: #E07A4C; --clay-ink: #14100D; --grass: #4CB37A; --grass-soft: #17322A; --clay-soft: #33221B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1421; --surface: #162033; --ink: #E7ECF3; --muted: #97A2B4; --faint: #56637A; --line: #26324A;
  --clay: #E07A4C; --clay-ink: #14100D; --grass: #4CB37A; --grass-soft: #17322A; --clay-soft: #33221B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 12px; padding-top: 20px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--clay); }
.pill { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { font: 600 14px var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px 4px; cursor: pointer; }
.tabs button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
main { display: flex; flex-direction: column; gap: 14px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hero .eyebrow, .hero .muted { color: var(--bg); opacity: .75; }
.hero h2 { font-size: 40px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.stat b { display: block; font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; color: var(--muted); }
.btn { font: 600 16px var(--body); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--clay); color: var(--clay-ink); border-color: var(--clay); }
.btn.small { font-size: 14px; padding: 8px 12px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--clay); outline-offset: 2px; }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ex-head > div { min-width: 0; }
.rx { font-family: var(--display); font-weight: 600; font-size: 20px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lvl { font-size: 13px; color: var(--muted); }
.cue { font-size: 15px; color: var(--muted); }
.why { font-size: 14px; color: var(--ink); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.why b { color: var(--clay); font-weight: 600; }
.badge { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; white-space: nowrap; align-self: flex-start; }
.badge.done { background: var(--grass-soft); color: var(--grass); }
.badge.lock { background: var(--clay-soft); color: var(--clay); }
.warn { background: var(--clay-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--grass); transition: width .3s; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--grass); }
input[type="password"] { font: 500 16px var(--body); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 140px; }

/* demo figure */
.demo-wrap { background: var(--bg); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.demo { width: 100%; height: auto; max-height: 200px; display: block; }
.demo .near { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; fill: none; }
.demo .far { stroke: var(--faint); stroke-width: 6; stroke-linecap: round; fill: none; }
.demo .head { fill: var(--ink); }
.demo .floor { stroke: var(--line); stroke-width: 2; }
.demo .prop { fill: var(--line); }
.demo .kb { fill: var(--clay); }
.demo-cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* set rows */
.sets { display: flex; flex-direction: column; gap: 8px; }
.setrow { display: grid; grid-template-columns: 44px 44px minmax(56px, 72px) 44px 1fr 52px; gap: 6px; align-items: center; }
.setrow .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.setrow .unit { font-size: 13px; color: var(--muted); }
.step { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 700 22px var(--body); cursor: pointer; line-height: 1; }
.val { width: 100%; height: 44px; text-align: center; font: 700 22px var(--display); border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.val::-webkit-outer-spin-button, .val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set { width: 52px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--muted); font: 700 18px var(--body); cursor: pointer; }
.set[aria-pressed="true"] { background: var(--grass); border-color: var(--grass); color: var(--surface); }
.setrow.is-done .val { border-color: var(--grass); }
.last { font-size: 14px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.last b { color: var(--ink); font-variant-numeric: tabular-nums; }
.vid { font-size: 14px; font-weight: 600; color: var(--clay); text-decoration: none; margin-left: auto; padding: 8px 4px; }

.log-item { display: flex; flex-direction: column; gap: 6px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.log-item:last-child { border-bottom: 0; }
.log-top { display: flex; justify-content: space-between; gap: 12px; }
.log-top b { font-weight: 600; }
.log-ex { font-size: 14px; color: var(--muted); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.log-ex span:nth-child(even) { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.ver { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .04em; padding-block: 8px; font-variant-numeric: tabular-nums; }
.daylist { display: flex; flex-direction: column; gap: 10px; }
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--bg);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.timer-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer .count { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .btn { background: transparent; color: var(--bg); border-color: var(--bg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--grass); color: #fff; font-weight: 600; padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); }
@media (max-width: 380px) { .setrow { grid-template-columns: 38px 40px minmax(48px, 64px) 40px 1fr 48px; gap: 4px; } .step { width: 40px; } .set { width: 48px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  squat:     { why: "Your legs make the power. Every throw and swing starts at the ground and travels up through your hips.", sets: 3, reps: "10-15", rest: 60, levels: ["Bodyweight squat", "Pause squat (3 sec at the bottom)", "Split squat", "Bulgarian split squat (back foot on bench)"], cue: "Chest up, knees track over toes, sit down like you're getting into a catcher's stance." },

function defaults() { return { phase: 1, unlocked: 1, next: { 1: 0, 2: 0 }, levels: {}, log: [], current: null }; }
let mem = null;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  return mem || defaults();
}
function save() { mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
if (S.current && !S.current.sets) S.current = null; // drop an in-progress workout from the older version
let view = S.current ? "workout" : "today";
let confirmKey = null;

const $ = (id) => document.getElementById(id);
const lvl = (id) => Math.min(S.levels[id] || 0, EX[id].levels.length - 1);
const dayOf = () => PHASES[S.phase].days[(S.next[S.phase] || 0) % 3];
const unitOf = (id) => /sec/.test(EX[id].reps) ? "sec" : "reps";
const nums = (id) => (EX[id].reps.match(/\d+/g) || ["10"]).map(Number);
const lowT = (id) => nums(id)[0];
const topT = (id) => Math.max(...nums(id));

const RANKS = [[0, "Rookie Ball"], [6, "Single-A"], [15, "Double-A"], [30, "Triple-A"], [50, "The Show"]];
function rankIdx(n) { let i = 0; RANKS.forEach((r, k) => { if (n >= r[0]) i = k; }); return i; }
function hello() { const h = new Date().getHours(); return h < 12 ? "Morning, Duke." : h < 17 ? "Afternoon, Duke." : "Evening, Duke."; }
function repsLogged() { return S.log.reduce((n, l) => n + (l.ex || []).filter(x => x.unit === "reps").reduce((m, x) => m + x.vals.reduce((a, b) => a + b, 0), 0), 0); }
function weekCount() {
  const now = new Date(); const back = (now.getDay() + 6) % 7;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
  return S.log.filter(l => new Date(l.date) >= start).length;
}
function totalSets(day) { return day.ex.reduce((n, id) => n + EX[id].sets, 0); }
function doneSets() { if (!S.current) return 0; return Object.values(S.current.sets).reduce((n, a) => n + a.filter(s => s.d).length, 0); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }

// History helpers
function history(id) { const out = []; for (let i = S.log.length - 1; i >= 0; i--) { const d = (S.log[i].ex || []).find(x => x.id === id); if (d && d.vals.length) out.push(d); } return out; }
function lastFor(id) { const name = EX[id].levels[lvl(id)]; return history(id).find(h => h.name === name) || null; }
function readyToLevel(id) {
  const name = EX[id].levels[lvl(id)]; const h = history(id).filter(x => x.name === name).slice(0, 2);
  return lvl(id) < EX[id].levels.length - 1 && h.length === 2 && h.every(x => x.vals.length >= EX[id].sets && x.vals.every(v => v >= topT(id)));
}

function render() {
  $("ver").textContent = `Version ${APP_VERSION} · ${APP_DATE}`;
  $("phasePill").textContent = PHASES[S.phase].short;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === view || (view === "workout" && b.dataset.view === "today"))));
  const v = $("view");
  if (view === "workout" && S.current) v.innerHTML = workoutHTML();
  else if (view === "program") v.innerHTML = programHTML();
  else if (view === "log") v.innerHTML = logHTML();
  else if (view === "rules") v.innerHTML = rulesHTML();
  else { view = "today"; v.innerHTML = todayHTML(); }
}

function todayHTML() {
  const d = dayOf(); const mins = 8 + d.ex.length * 5 + 4;
  const resume = !!S.current; const n = S.log.length; const ri = rankIdx(n);
  const next = RANKS[ri + 1]; const from = RANKS[ri][0];
  const pct = next ? Math.round((n - from) / (next[0] - from) * 100) : 100;
  const wk = weekCount();
  const sub = resume ? "You've got a workout going. Finish it out." : wk >= 3 ? "You already hit 3 this week. Extra day is optional. Recovery is when the gains actually happen." : n === 0 ? "Day one. Everybody starts in Rookie Ball." : `Workout #${n + 1} is on deck.`;
  return `
  <section class="card hero">
    <p class="eyebrow">${hello()}</p>
    <h2>Day ${d.key}: ${d.name}</h2>
    <p class="muted">${sub}</p>
    <p class="muted">${d.ex.length} exercises · about ${mins} min with warmup and cooldown</p>
    <button type="button" class="btn primary" data-act="${resume ? "resume" : "start"}">${resume ? "Get back in there" : "Let's go"}</button>
  </section>
  <div class="stats">
    <div class="stat"><b>${wk}/3</b><small>This week</small></div>
    <div class="stat"><b>${n}</b><small>Workouts</small></div>
    <div class="stat"><b>${repsLogged()}</b><small>Reps logged</small></div>
  </div>
  <section class="card">
    <div class="ex-head"><div><p class="eyebrow">Your level</p><h3>${RANKS[ri][1]}</h3></div>${next ? `<span class="rx">${next[0] - n} to ${next[1]}</span>` : '<span class="badge done">Made it</span>'}</div>
    <div class="progress" aria-label="Progress to next level"><i style="width:${pct}%"></i></div>
    <p class="muted">${next ? `Every finished workout moves you up. ${next[1]} at ${next[0]} workouts.` : "You made The Show. Nobody stays here by accident. Keep showing up."}</p>
  </section>
  <section class="card">
    <h3>How this works</h3>
    <ul class="plain">
      <li>Three workouts a week: A, then B, then C. Never two days in a row. Your muscles get stronger while you rest, not while you lift.</li>
      <li>Watch the stick figure before each exercise. Still not sure? Hit <b>Watch a video</b>.</li>
      <li>Log what you <i>actually</i> did with <b>−</b> and <b>+</b>, then tap <b>✓</b>. The rest timer runs on its own.</li>
      <li>The app tracks your numbers. When you max out the rep range two workouts in a row, it tells you you're ready to level up. That's called progressive overload, and it's how every pro gets stronger.</li>
      <li>Sloppy rep? Set's over. Bad reps train bad habits.</li>
    </ul>
  </section>`;
}

function demoHTML(id) {
  const vs = DEMO[id]; if (!vs) return "";
  const vi = Array.isArray(vs) ? Math.min(lvl(id), vs.length - 1) : 0;
  const v = Array.isArray(vs) ? vs[vi] : vs;
  const cap = [v.view, v.hold ? "Get into position, then hold still" : ""].filter(Boolean).join(" · ");
  return `<div class="demo-wrap">
    <svg class="demo" viewBox="0 -12 200 150" role="img" aria-label="Animated demo of ${EX[id].levels[lvl(id)]}" data-demo="${id}" data-vi="${vi}"></svg>
    ${cap ? `<div class="demo-cap"><span>${cap}</span></div>` : ""}
  </div>`;
}

function exCard(id) {
  const e = EX[id]; const L = lvl(id); const rows = S.current.sets[id];
  const all = rows.every(s => s.d); const unit = unitOf(id);
  const last = lastFor(id);
  const q = encodeURIComponent(e.levels[L] + " exercise proper form");
  const setRows = rows.map((s, i) => `
    <div class="setrow ${s.d ? "is-done" : ""}">
      <span class="lbl">Set ${i + 1}</span>
      <button type="button" class="step" data-act="dec" data-id="${id}" data-i="${i}" aria-label="Fewer">−</button>
      <input class="val" type="number" inputmode="numeric" min="0" max="300" id="v-${id}-${i}" data-id="${id}" data-i="${i}" value="${s.v}" aria-label="Set ${i + 1} ${unit}">
      <button type="button" class="step" data-act="inc" data-id="${id}" data-i="${i}" aria-label="More">+</button>
      <span class="unit">${unit}${/each/.test(e.reps) ? " each" : ""}</span>
      <button type="button" class="set" aria-pressed="${s.d}" aria-label="Mark set ${i + 1} done" data-act="set" data-id="${id}" data-i="${i}">✓</button>
    </div>`).join("");
  return `
  <article class="card">
    <div class="ex-head">
      <div><h3>${e.levels[L]}</h3><p class="lvl">Level ${L + 1} of ${e.levels.length} · rest ${e.rest}s</p></div>
      ${all ? '<span class="badge done">Done</span>' : `<span class="rx">${e.sets} × ${e.reps}</span>`}
    </div>
    ${demoHTML(id)}
    <p class="cue">${e.cue}</p>
    <p class="why"><b>Why it matters:</b> ${e.why}</p>
    <div class="sets">${setRows}</div>
    <div class="last">${last ? `Last time: <b>${last.vals.join(", ")}</b> ${unit}` : "First time at this level. Set the baseline."}${readyToLevel(id) ? ' <span class="badge done">Ready to level up</span>' : ""}</div>
    <div class="row">
      <button type="button" class="btn small ghost" data-act="lvl" data-id="${id}" data-d="-1" ${L === 0 ? "disabled" : ""}>Easier</button>
      <button type="button" class="btn small ghost" data-act="lvl" data-id="${id}" data-d="1" ${L === e.levels.length - 1 ? "disabled" : ""}>Harder</button>
      <a class="vid" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Watch a video ↗</a>
    </div>
  </article>`;
}

function workoutHTML() {
  const c = S.current; const d = PHASES[c.phase].days[c.day];
  const tot = totalSets(d); const dn = doneSets(); const pct = Math.round(dn / tot * 100);
  return `
  <section class="card">
    <p class="eyebrow">${PHASES[c.phase].name}</p>
    <h2>Day ${d.key}: ${d.name}</h2>
    <div class="progress" aria-label="${dn} of ${tot} sets done"><i style="width:${pct}%"></i></div>
    <p class="muted">${dn} of ${tot} sets done</p>
  </section>
  <section class="card">
    <div class="ex-head"><h3>Warmup</h3><span class="rx">8 min</span></div>
    <ul class="plain">${WARMUP.map(w => `<li>${w}</li>`).join("")}</ul>
    <label class="check"><input type="checkbox" id="warmDone" ${c.warm ? "checked" : ""}> Warmup done</label>
  </section>
  ${d.ex.map(exCard).join("")}
  <section class="card">
    <div class="ex-head"><h3>Cooldown</h3><span class="rx">5 min</span></div>
    <ul class="plain">${COOLDOWN.map(w => `<li>${w}</li>`).join("")}</ul>
  </section>
  <button type="button" class="btn primary" data-act="finish" ${dn === 0 ? "disabled" : ""}>Log it and finish</button>
  <button type="button" class="btn ghost" data-act="quit">${confirmKey === "quit" ? "Tap again to bail (nothing gets saved)" : "Quit workout"}</button>`;
}

function programHTML() {
  const block = (p) => PHASES[p].days.map(d => `
    <div><p class="eyebrow">Day ${d.key}</p><h3>${d.name}</h3>
    <p class="muted">${d.ex.map(id => EX[id].levels[lvl(id)]).join(" · ")}</p></div>`).join("");
  const p2open = S.unlocked >= 2;
  return `
  <section class="card">
    <div class="ex-head"><div><p class="eyebrow">Phase 1</p><h2>${PHASES[1].name}</h2></div>${S.phase === 1 ? '<span class="badge done">Current</span>' : ""}</div>
    <p class="muted">Bodyweight only. This is where you build the foundation: form, control, and real strength. Plan on 6 to 8 weeks here. No shortcuts.</p>
    <div class="daylist">${block(1)}</div>
    ${S.phase !== 1 ? '<button type="button" class="btn" data-act="phase" data-p="1">Switch to Phase 1</button>' : ""}
  </section>
  <section class="card">
    <div class="ex-head"><div><p class="eyebrow">Phase 2</p><h2>${PHASES[2].name}</h2></div>${S.phase === 2 ? '<span class="badge done">Current</span>' : p2open ? "" : '<span class="badge lock">Locked</span>'}</div>
    <p class="muted">Now we add load. Start with the lightest bell and only go heavier when every single rep looks clean.</p>
    <div class="daylist">${block(2)}</div>
    ${p2open
      ? (S.phase !== 2 ? '<button type="button" class="btn primary" data-act="phase" data-p="2">Switch to Phase 2</button>' : "")
      : `<p class="warn">Dad unlocks this once he signs off on your squat, lunge, and push-up form. Earn it.</p>
         <form class="row" id="unlockForm"><input type="password" id="unlockCode" inputmode="numeric" placeholder="Parent code" aria-label="Parent code"><button type="submit" class="btn">Unlock</button></form>
         <p class="muted" id="unlockMsg" hidden>Wrong code. Nice try though.</p>`}
  </section>
  <section class="card">
    <div class="ex-head"><div><p class="eyebrow">Phase 3</p><h2>Barbell Basics</h2></div><span class="badge lock">Parent present</span></div>
    <p class="muted">Barbell squat, Romanian deadlift, and bench press, starting with an empty bar. Dad has to be in the room, and bench press always needs a spotter. Not built yet. This unlocks when you're ready for it.</p>
  </section>`;
}

function logHTML() {
  if (!S.log.length) return `<section class="card"><h3>No workouts yet</h3><p class="muted">Your first workout shows up here, every set and rep. In a few weeks, scroll back and compare. That's the fun part.</p></section>`;
  const rows = S.log.slice().reverse().map(l => `
    <div class="log-item">
      <div class="log-top"><div><b>Day ${l.key}: ${l.name}</b><p class="muted">${fmtDate(l.date)} · Phase ${l.phase}</p></div><span class="rx">${l.sets}/${l.total} sets</span></div>
      ${l.ex ? `<div class="log-ex">${l.ex.filter(x => x.vals.length).map(x => `<span>${x.name}</span><span>${x.vals.join(", ")} ${x.unit}</span>`).join("")}</div>` : ""}
    </div>`).join("");
  return `
  <section class="card"><div class="ex-head"><h2>Workout log</h2><span class="muted">${S.log.length} total</span></div><div>${rows}</div></section>
  <button type="button" class="btn ghost" data-act="clearlog">${confirmKey === "clearlog" ? "Tap again to erase the whole log" : "Clear log"}</button>`;
}

function rulesHTML() {
  return `
  <section class="card">
    <h2>Ground rules</h2>
    <ul class="plain">
      <li><b>Form beats numbers.</b> Ten perfect reps beat fifteen ugly ones. If form breaks, the set is over.</li>
      <li><b>Log honestly.</b> The app only helps if the numbers are real. Nobody's grading you except you.</li>
      <li><b>Rest days are part of the program.</b> Training breaks muscle down a little. Rest is when it rebuilds stronger. Skip rest and you skip the gains.</li>
      <li><b>Sore is fine. Pain is not.</b> Achy muscles the next day are normal. Sharp pain or anything in a joint means stop and tell Dad.</li>
      <li><b>No max outs.</b> We never test how much you can lift one time. Not worth it at 12.</li>
      <li><b>Your arm comes first.</b> Big throwing or pitching day? Skip Day B, or just do the Y-T-W raises.</li>
      <li><b>Barbell and bench press</b> only with Dad in the room.</li>
      <li><b>Refuel.</b> Water, plus a real meal or snack with some protein after training.</li>
    </ul>
  </section>
  <section class="card">
    <h3>Put this on your phone</h3>
    <ul class="plain">
      <li>iPhone: open this in Safari, tap Share, then Add to Home Screen.</li>
      <li>Android: open in Chrome, tap the menu, then Add to Home screen.</li>
      <li>Your data lives on your phone. Use the same one every time.</li>
    </ul>
  </section>`;
}

/* ---------- Demo animation ---------- */
const NS = "http://www.w3.org/2000/svg";
const reduceMotion = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();
function mk(svg, tag, cls, attrs) { const el = document.createElementNS(NS, tag); if (cls) el.setAttribute("class", cls); for (const k in (attrs || {})) el.setAttribute(k, attrs[k]); svg.appendChild(el); return el; }
function variantOf(svg) { const vs = DEMO[svg.dataset.demo]; return Array.isArray(vs) ? vs[+svg.dataset.vi] : vs; }
function build(svg) {
  const v = variantOf(svg); const f = {};
  if (!v.view || !/above/.test(v.view)) mk(svg, "line", "floor", { x1: 8, y1: 132, x2: 192, y2: 132 });
  if (v.bench) { const [x, y, w] = v.bench; mk(svg, "rect", "prop", { x, y, width: w, height: 6, rx: 2 }); mk(svg, "rect", "prop", { x: x + 4, y: y + 6, width: 4, height: 132 - y - 6 }); mk(svg, "rect", "prop", { x: x + w - 8, y: y + 6, width: 4, height: 132 - y - 6 }); }
  const L = (c) => mk(svg, "line", c);
  f.fa1 = L("far"); f.fa2 = L("far"); f.fl1 = L("far"); f.fl2 = L("far"); if (v.foot !== false) f.ff = L("far");
  f.torso = L("near"); f.nl1 = L("near"); f.nl2 = L("near"); if (v.foot !== false) f.nf = L("near");
  f.head = mk(svg, "circle", "head", { r: 8 });
  f.na1 = L("near"); f.na2 = L("near");
  if (v.p[0].length > 22) f.kb = mk(svg, "circle", "kb", { r: 6.5 });
  svg._f = f; svg._v = v;
}
function seg(el, a, b) { if (!el) return; el.setAttribute("x1", a[0]); el.setAttribute("y1", a[1]); el.setAttribute("x2", b[0]); el.setAttribute("y2", b[1]); }
function pose(svg, P) {
  const f = svg._f; const pt = (i) => [P[i * 2], P[i * 2 + 1]];
  const H = pt(0), N = pt(1), E = pt(2), W = pt(3), E2 = pt(4), W2 = pt(5), Hp = pt(6), K = pt(7), A = pt(8), K2 = pt(9), A2 = pt(10);
  seg(f.fa1, N, E2); seg(f.fa2, E2, W2); seg(f.fl1, Hp, K2); seg(f.fl2, K2, A2); seg(f.ff, A2, [A2[0] + 8, A2[1]]);
  seg(f.torso, N, Hp); seg(f.nl1, Hp, K); seg(f.nl2, K, A); seg(f.nf, A, [A[0] + 8, A[1]]);
  f.head.setAttribute("cx", H[0]); f.head.setAttribute("cy", H[1]);
  seg(f.na1, N, E); seg(f.na2, E, W);
  if (f.kb) { f.kb.setAttribute("cx", P[22]); f.kb.setAttribute("cy", P[23]); }
}
function frame(now) {
  document.querySelectorAll("svg.demo").forEach(svg => {
    if (!svg._f) build(svg);
    const v = svg._v, ps = v.p;
    if (ps.length === 1 || reduceMotion) { pose(svg, ps[ps.length - 1]); return; }
    const D = v.speed || 1100; const n = ps.length;
    const u = (now / D) % n; const i = Math.floor(u); let t = u - i;
    t = Math.min(1, Math.max(0, (t - 0.25) / 0.6)); t = t * t * (3 - 2 * t);
    const a = ps[i], b = ps[(i + 1) % n]; const len = Math.min(a.length, b.length);
    const P = new Array(len); for (let k = 0; k < len; k++) P[k] = a[k] + (b[k] - a[k]) * t;
    pose(svg, P);
  });
  requestAnimationFrame(frame);
}

/* ---------- Rest timer ---------- */
let tEnd = 0, tInt = null, ac = null;
function ensureAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} }
function beep() {
  try { if (!ac) return; [0, 0.35].forEach(off => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + off); o.stop(ac.currentTime + off + 0.2); }); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function tick() {
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $("timerCount").textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "Go!";
  if (left <= 0) { clearInterval(tInt); tInt = null; beep(); setTimeout(() => { if (!tInt) $("timer").hidden = true; }, 2500); }
}
function startTimer(sec) { tEnd = Date.now() + sec * 1000; $("timer").hidden = false; clearInterval(tInt); tInt = setInterval(tick, 250); tick(); }
function stopTimer() { clearInterval(tInt); tInt = null; $("timer").hidden = true; }

let wake = null;
function keepAwake() { try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w).catch(() => {}); } catch (e) {} }

let toastT = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

function newWorkout() {
  const day = (S.next[S.phase] || 0) % 3; const d = PHASES[S.phase].days[day]; const sets = {};
  d.ex.forEach(id => { const last = lastFor(id); sets[id] = Array.from({ length: EX[id].sets }, (_, i) => ({ v: last && last.vals[i] != null ? last.vals[i] : lowT(id), d: false })); });
  return { phase: S.phase, day, sets, warm: false };
}

document.addEventListener("click", (ev) => {
  const tab = ev.target.closest(".tabs button");
  if (tab) { confirmKey = null; view = tab.dataset.view === "today" && S.current ? "workout" : tab.dataset.view; render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act !== "quit" && act !== "clearlog") confirmKey = null;
  if (act === "start") { ensureAudio(); S.current = newWorkout(); save(); view = "workout"; keepAwake(); render(); window.scrollTo(0, 0); }
  else if (act === "resume") { view = "workout"; keepAwake(); render(); }
  else if (act === "inc" || act === "dec") {
    const id = b.dataset.id, s = S.current.sets[id][+b.dataset.i]; const step = unitOf(id) === "sec" ? 5 : 1;
    s.v = Math.max(0, Math.min(300, (+s.v || 0) + (act === "inc" ? step : -step))); save();
    const inp = $(`v-${id}-${b.dataset.i}`); if (inp) inp.value = s.v;
  } else if (act === "set") {
    ensureAudio();
    const id = b.dataset.id, i = +b.dataset.i; const s = S.current.sets[id][i];
    const inp = $(`v-${id}-${i}`); if (inp) s.v = Math.max(0, Math.min(300, parseInt(inp.value, 10) || 0));
    s.d = !s.d; save();
    const d = PHASES[S.current.phase].days[S.current.day];
    if (s.d && doneSets() < totalSets(d)) startTimer(EX[id].rest);
    if (doneSets() === totalSets(d)) { stopTimer(); toast("Every set done. Cool down, then log it."); }
    render();
  } else if (act === "lvl") {
    const id = b.dataset.id; S.levels[id] = Math.max(0, Math.min(EX[id].levels.length - 1, lvl(id) + +b.dataset.d));
    if (S.current && S.current.sets[id] && !S.current.sets[id].some(s => s.d)) S.current.sets[id].forEach(s => s.v = lowT(id));
    save(); render();
  } else if (act === "finish") {
    const c = S.current; const d = PHASES[c.phase].days[c.day];
    const ex = d.ex.map(id => ({ id, name: EX[id].levels[lvl(id)], unit: unitOf(id), vals: c.sets[id].filter(s => s.d).map(s => s.v) }));
    const before = rankIdx(S.log.length);
    S.log.push({ date: new Date().toISOString(), phase: c.phase, key: d.key, name: d.name, sets: doneSets(), total: totalSets(d), ex });
    S.next[c.phase] = (c.day + 1) % 3; S.current = null; save(); stopTimer();
    try { wake && wake.release(); } catch (e) {}
    const after = rankIdx(S.log.length);
    view = "today"; render(); window.scrollTo(0, 0);
    toast(after > before ? `Called up to ${RANKS[after][1]}. Let's go, Duke.` : `Workout #${S.log.length} in the books.`);
  } else if (act === "quit") {
    if (confirmKey === "quit") { S.current = null; save(); stopTimer(); confirmKey = null; view = "today"; render(); window.scrollTo(0, 0); }
    else { confirmKey = "quit"; render(); }
  } else if (act === "clearlog") {
    if (confirmKey === "clearlog") { S.log = []; save(); confirmKey = null; render(); }
    else { confirmKey = "clearlog"; render(); }
  } else if (act === "phase") {
    if (S.current) { toast("Finish or quit the workout you started first."); return; }
    S.phase = +b.dataset.p; save(); render(); toast(`Switched to ${PHASES[S.phase].name}.`);
  } else if (act === "timer-add") { tEnd += 15000; if (!tInt) { tInt = setInterval(tick, 250); $("timer").hidden = false; } tick(); }
  else if (act === "timer-skip") { stopTimer(); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "warmDone" && S.current) { S.current.warm = t.checked; save(); }
  if (t.classList.contains("val") && S.current) { const s = S.current.sets[t.dataset.id][+t.dataset.i]; s.v = Math.max(0, Math.min(300, parseInt(t.value, 10) || 0)); t.value = s.v; save(); }
});
document.addEventListener("submit", (ev) => {
  if (ev.target.id !== "unlockForm") return;
  ev.preventDefault();
  if ($("unlockCode").value.trim() === PARENT_CODE) { S.unlocked = 2; save(); render(); toast("Phase 2 unlocked. Kettlebells are in play."); }
  else { $("unlockMsg").hidden = false; }
});
render();
requestAnimationFrame(frame);
</script>

</body>
